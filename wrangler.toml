name = "zaiko01"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
# すべてのアクセスでログインを確認する
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "zaiko01-db"
database_id = "764cdbe8-60d6-4980-b2ef-bd7dd30f9ebc"
migrations_dir = "migrations"

# コーションプレートの読み取りに使う Workers AI
[ai]
binding = "AI"
