name = "zaiko01"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
# ログイン用の LOGIN_ID / LOGIN_PASSWORD / SESSION_SECRET はダッシュボードの
# 「変数とシークレット」で管理する（パスワードをGitHubに残さないため、ここには書かない）。
# ダッシュボードで追加した変数がデプロイで消されないようにする
keep_vars = true

[assets]
directory = "public"
binding = "ASSETS"
# すべてのアクセスでログインを確認する
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "zaiko01-db"
database_id = "3903c653-36c5-47d0-b92e-cbdb48334bd8"
migrations_dir = "migrations"

# コーションプレートの読み取りに使う Workers AI
[ai]
binding = "AI"
