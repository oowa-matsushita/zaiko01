<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>データをアップロード｜中古車 買取在庫</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>データをアップロード</h1>
    <span class="top-actions"><a href="/" class="back">← 在庫一覧へ</a></span>
  </header>

  <section class="up-box" id="drop">
    <p class="up-title">在庫データのCSVを選んでください</p>
    <label class="scan-btn up-btn">
      <input id="file" type="file" accept=".csv,text/csv" hidden>
      📄 CSVファイルを選ぶ
    </label>
    <p class="muted up-note">ここにドラッグしても読み込めます。Shift-JIS（Excel出力）・UTF-8 どちらも可。<br>
      車台番号が在庫にある車両は <b>上書きせずスキップ</b> し、新規の車両だけを追加します。</p>
    <label class="check-all"><input type="checkbox" id="fill-empty"> 在庫にある車両の<b>空欄の項目だけ</b>補う（初度登録・色・カラーコード・走行距離・買取金額。入力済みの項目は変えません）</label>
  </section>

  <section id="preview" hidden>
    <div class="up-summary" id="summary"></div>
    <div class="row">
      <label class="check-all"><input type="checkbox" id="only-new" checked> 新規・補う車両だけ表示</label>
      <span class="spacer"></span>
      <button id="btn-cancel-up">やり直す</button>
      <button id="btn-import" class="primary">新規 0 台を追加する</button>
    </div>
    <div class="table-wrap">
      <table id="up-tbl">
        <thead><tr><th>行</th><th>判定</th><th>初度登録</th><th>車名</th><th>車台番号</th><th>色</th><th>カラーコード</th><th>走行距離</th><th>買取金額</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/upload.js" type="module"></script>
</body>
</html>
