<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AA結果｜中古車 買取在庫</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="tabs-top" aria-label="ページ">
    <a href="/" class="">在庫一覧</a>
    <a href="/aa" class="on">AA結果</a>
    <a href="/upload" class="">データをアップロード</a>
  </nav>
  <header class="top">
    <h1>AA結果（オークション結果）</h1>
    <span class="top-actions"><a href="/logout" class="logout">ログアウト</a></span>
  </header>

  <section class="filters">
    <div class="search-box">
      <label for="aq" class="search-label">🔍 検索</label>
      <input id="aq" type="search" autocomplete="off" placeholder="車種・グレード・型式・車台番号・色・出品番号（スペースで複数）">
      <button type="button" id="aq-clear" class="search-clear" hidden>✕ クリア</button>
    </div>
    <div class="row aa-filters">
      <label>開催日 <select id="a-date"><option value="">すべて</option></select></label>
      <label>結果 <select id="a-result"><option value="">すべて</option><option value="sold">落札（商談含む）</option><option value="unsold">流れ・キャンセル</option></select></label>
      <span class="spacer"></span>
      <span id="a-stat" class="aa-stat"></span>
    </div>
  </section>

  <div class="table-wrap">
    <table id="aa-tbl" class="aa-tbl">
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <p class="muted hint">列名をクリックで並び替え。黄色の行は今の在庫にある車両です。結果のCSVは「データをアップロード」から取り込めます。</p>
  <script src="/aa.js" type="module"></script>
</body>
</html>
