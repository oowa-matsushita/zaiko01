<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>中古車 買取在庫管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>中古車 買取在庫</h1>
    <span class="top-actions">
      <a href="/upload" class="logout">データをアップロード</a>
      <a href="/logout" class="logout">ログアウト</a>
      <button id="btn-add" class="primary">＋ 買取登録</button>
    </span>
  </header>

  <section class="filters">
    <input id="q" type="search" placeholder="車名・車台番号・色・メモなどで検索">
    <div class="date-filters">
      <div class="df-row"><span class="df-label">開催日</span><div id="f-event" class="date-boxes" role="group" aria-label="開催日"></div></div>
      <div class="df-row"><span class="df-label">出庫日</span><div id="f-shipped" class="date-boxes" role="group" aria-label="出庫日"></div></div>
    </div>
    <div class="row">
      <span id="count" class="muted"></span>
      <span class="spacer"></span>
      <button class="toggle" data-own="done" aria-pressed="false" title="自社名の日付が入っている車両だけを表示">自社名済のみ表示</button>
      <button class="toggle" data-own="wait" aria-pressed="false" title="自社名の日付がまだ入っていない車両だけを表示">自社名待ちのみ表示</button>
      <button id="btn-layout"></button>
      <button id="btn-print">🖨 一覧印刷</button>
      <span class="menu-wrap">
        <button id="btn-request" class="primary" aria-haspopup="true">依頼する ▾</button>
        <span id="req-menu" class="menu" hidden>
          <button type="button" data-req="mail">✉ メール（コピーして貼り付け）</button>
          <button type="button" data-req="pdf">🖨 PDF（印刷）</button>
        </span>
      </span>
      <button id="btn-before-ship" class="toggle" aria-pressed="false" title="出庫日が今日以降、または出庫日が未定の車両だけを表示">出庫前のみ表示</button>
    </div>
  </section>

  <div class="table-wrap">
    <table id="tbl">
      <thead></thead>
    </table>
  </div>
  <p class="muted hint">セルをダブルクリック（ダブルタップ）でその場で編集、Enterで保存・Escで取消。✎ でフォーム編集・削除。列名で並び替え。</p>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlg-title">買取登録</h2>
      <input type="hidden" name="id">
      <div class="full plate-scan">
        <label class="scan-btn">
          <input id="plate-file" type="file" accept="image/*" capture="environment" hidden>
          📷 コーションプレートを撮影
        </label>
        <p class="scan-note muted">撮影すると 車台番号・カラーコード を自動で入力します</p>
        <div class="scan-result" hidden>
          <img id="plate-preview" alt="撮影したコーションプレート">
          <p id="plate-status" aria-live="polite"></p>
        </div>
      </div>
      <label class="full">初度登録<input name="first_reg" placeholder="例：平成24年06月"></label>
      <label class="full">車名 *<input name="name" required placeholder="例：プリウス"></label>
      <label class="full">車台番号<input name="chassis_no" autocapitalize="characters" placeholder="例：ZVW30-1234567"></label>
      <label>色<input name="color" list="dl-color" placeholder="例：パールホワイト"></label>
      <label>カラーコード<input name="color_code" autocapitalize="characters" placeholder="例：070"></label>
      <label class="full">走行距離
        <span class="with-unit">
          <input name="mileage" type="text" inputmode="numeric" autocomplete="off" placeholder="例：45000">
          <select name="mileage_unit" aria-label="距離の単位">
            <option value="km">km</option>
            <option value="mile">マイル</option>
          </select>
        </span>
        <small class="mileage-conv"></small>
      </label>
      <label>買取金額(円)<input name="purchase_price" inputmode="numeric" autocomplete="off" placeholder="例：500000"></label>
      <label>着地予想(円)<input name="landing_price" inputmode="numeric" autocomplete="off" placeholder="例：650000"></label>
      <label>自社名<input name="own_date" type="date"></label>
      <label>会場
        <select name="venue">
          <option value="">未選択</option>
          <option>名古屋</option>
          <option>静岡</option>
          <option>廃車</option>
        </select>
      </label>
      <label>開催日<input name="event_date" type="date"></label>
      <label>出庫日<input name="shipped_date" type="date"></label>
      <div class="full checks">
        <label class="check"><input type="checkbox" name="has_warranty"> 保証書あり</label>
        <label class="check"><input type="checkbox" name="has_manual"> 取扱説明書あり</label>
      </div>
      <label class="full">メモ<textarea name="notes" rows="3"></textarea></label>
      <p id="form-error" class="error full" role="alert"></p>
      <div class="actions full">
        <button type="button" id="btn-delete" class="danger">削除</button>
        <span class="spacer"></span>
        <button type="button" id="btn-cancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>
  <datalist id="dl-color"></datalist>

  <script src="/app.js" type="module"></script>
</body>
</html>
