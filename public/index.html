<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>中古車 買取在庫管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>中古車 買取在庫</h1>
    <button id="btn-add" class="primary">＋ 買取登録</button>
  </header>

  <section id="stats" class="stats" aria-label="集計"></section>

  <section class="filters">
    <input id="q" type="search" placeholder="車名・車台番号・色・仕入先などで検索">
    <div class="tabs" role="tablist">
      <button data-status="" class="active">すべて</button>
      <button data-status="in_stock">在庫</button>
      <button data-status="listed">出品中</button>
      <button data-status="sold">売却済</button>
    </div>
    <div class="row">
      <select id="sort" aria-label="並び順">
        <option value="purchase_date_desc">買取日が新しい順</option>
        <option value="purchase_date_asc">買取日が古い順</option>
        <option value="updated_desc">更新が新しい順</option>
        <option value="price_desc">買取価格が高い順</option>
        <option value="mileage_asc">走行距離が少ない順</option>
      </select>
      <button id="btn-csv">CSV出力</button>
    </div>
  </section>

  <p id="count" class="muted"></p>
  <ul id="list" class="list"></ul>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlg-title">買取登録</h2>
      <input type="hidden" name="id">
      <label class="full">車名 *<input name="name" required placeholder="例：トヨタ プリウス S"></label>
      <label class="full">車台番号<input name="chassis_no" autocapitalize="characters" placeholder="例：ZVW30-1234567"></label>
      <label>色<input name="color" list="dl-color" placeholder="例：パールホワイト"></label>
      <label>カラーコード<input name="color_code" autocapitalize="characters" placeholder="例：070"></label>
      <label class="full">走行距離
        <span class="with-unit">
          <input name="mileage" type="number" inputmode="numeric" min="0" placeholder="例：45000">
          <select name="mileage_unit" aria-label="距離の単位">
            <option value="km">km</option>
            <option value="mile">マイル</option>
          </select>
        </span>
        <small class="mileage-conv"></small>
      </label>
      <label class="full">セールスポイント<textarea name="sales_points" rows="3" placeholder="例：ワンオーナー、禁煙車、記録簿あり、スタッドレス付き"></textarea></label>
      <div class="full checks">
        <label class="check"><input type="checkbox" name="has_warranty"> 保証書あり</label>
        <label class="check"><input type="checkbox" name="has_manual"> 取扱説明書あり</label>
      </div>
      <label>買取日<input name="purchase_date" type="date"></label>
      <label>買取価格(円)<input name="purchase_price" type="number" inputmode="numeric" min="0"></label>
      <label>仕入先・買取元<input name="supplier" list="dl-supplier"></label>
      <label>保管場所<input name="location" list="dl-location"></label>
      <label>販売予定価格(円)<input name="list_price" type="number" inputmode="numeric" min="0"></label>
      <label>ステータス
        <select name="status">
          <option value="in_stock">在庫</option>
          <option value="listed">出品中</option>
          <option value="sold">売却済</option>
        </select>
      </label>
      <fieldset class="full sold-fields">
        <legend>販売情報</legend>
        <label>販売日<input name="sold_date" type="date"></label>
        <label>販売価格(円)<input name="sold_price" type="number" inputmode="numeric" min="0"></label>
        <label>手数料・送料(円)<input name="fees" type="number" inputmode="numeric" min="0"></label>
        <p class="profit-preview muted full"></p>
      </fieldset>
      <label class="full">メモ<textarea name="notes" rows="3"></textarea></label>
      <p id="form-error" class="error full" role="alert"></p>
      <div class="actions full">
        <button type="button" id="btn-delete" class="danger">削除</button>
        <span class="spacer"></span>
        <button type="button" id="btn-cancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>
  <datalist id="dl-color"></datalist>
  <datalist id="dl-supplier"></datalist>
  <datalist id="dl-location"></datalist>

  <script src="/app.js" type="module"></script>
</body>
</html>
